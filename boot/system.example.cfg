[network]
mode=auto ; auto/wifi/ethernet
#open_net_ssid= ; set SSID to join an open network
dhcp=true
; used only if dhcp=false
#ip=192.168.0.250
#netmask=255.255.255.0
#gateway=192.168.0.1
#dns=192.168.0.1

[http]
port=80
max_content_size=2048
timeout_seconds=10
max_clients=10

[cse]
; If this parameters are changed, the database must be cleared/deleted to avoid conflicts with
; existing resources. This projects does not support updates and deletes.
resource_name=zerom2m     ; rn
resource_id=zerom2m       ; ri
cse_id=/zerom2m           ; csi
sp_id=zerom2m.example.com ; used for SPID-based addressing

[system]
clean_db_on_boot=false
hostname=zerom2m
; This lets you choose which application to run. This is useful when you have multiple applications
; compiled in the same firmware.
; The value selects what task to run in SystemManager::StartServices().
p2p_task=0
